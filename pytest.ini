# Pytest configuration for Transkrybe.ai

[pytest]
testpaths = tests
# Mirrors the sys.path setup in backend/main.py: backend/ and its subpackages
# must be importable by their flat module names (`from config import ...`,
# `from logging_config import ...`) because that is how backend modules import
# each other at runtime. The leading `.` is required by tests/test_analysis/,
# which imports via the `backend.analysis.*` package path.
pythonpath = . backend backend/core backend/engines
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
markers =
    unit: Unit tests that test individual functions/classes
    integration: Integration tests that test module interactions
    api: Tests that require external API calls
    slow: Tests that take longer than 5 seconds
    validation: Comprehensive validation tests (replaces validation scripts)
    core: Tests for core functionality
    data: Tests involving data processing
    infrastructure: Tests for supporting infrastructure
    smoke: Quick smoke tests for basic functionality
    regression: Tests for specific bug fixes

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test coverage settings
[coverage:run]
source = backend
omit =
    tests/*
    __pycache__/*
    .venv/*
    venv/*
    */site-packages/*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
