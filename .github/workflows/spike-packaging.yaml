# THROWAWAY Phase 0.5 packaging spike. Lives only on desktop/spike-packaging;
# replaced by the real release workflow in Phase 3. Results are emitted as
# ::notice annotations so they can be read without log access.
name: Spike packaging

on:
  push:
    branches: [desktop/spike-packaging]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      working-directory: frontend
      run: npm ci && npm run build

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pyinstaller pywebview

    - name: Versions
      shell: bash
      run: echo "::notice title=versions ${{ runner.os }}::$(pip list --format=freeze | grep -iE '^(pyinstaller|pywebview|pyobjc-core|pythonnet|uvicorn)=' | tr '\n' ' ')"

    - name: PyInstaller
      shell: bash
      run: |
        start=$(date +%s)
        pyinstaller spike/spike.spec --noconfirm --log-level WARN
        echo "::notice title=build ${{ runner.os }}::$(( $(date +%s) - start ))s; size $(du -sh dist/Transcribe-HTR* | tr '\n' ' ')"

    - name: Codesign (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        sig=$(codesign -dv dist/Transcribe-HTR.app 2>&1 | grep -E 'Signature|Identifier|Format' | tr '\n' ' ')
        if codesign --verify --deep --strict dist/Transcribe-HTR.app; then v=OK; else v=FAIL; fi
        echo "::notice title=codesign::verify=$v; $sig"

    - name: Frozen checks (macOS)
      if: runner.os == 'macOS'
      shell: bash
      working-directory: /
      run: |
        BIN="$GITHUB_WORKSPACE/dist/Transcribe-HTR.app/Contents/MacOS/Transcribe-HTR"
        rc=0
        for mode in --smoke-test --self-check; do
          out=$("$BIN" $mode 2>&1) || rc=1
          echo "$out"
          echo "::notice title=macOS $mode::$(echo "$out" | grep -E 'SMOKE|SELFCHECK' | tail -1)"
        done
        exit $rc

    - name: Frozen checks (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: C:\
      run: |
        $exe = "$env:GITHUB_WORKSPACE\dist\Transcribe-HTR\Transcribe-HTR.exe"
        $rc = 0
        foreach ($mode in "--smoke-test", "--self-check") {
          $p = Start-Process -FilePath $exe -ArgumentList $mode -PassThru -Wait
          $line = Get-Content "$env:TEMP\transcribe_htr_spike.log" -Tail 1
          Write-Output "::notice title=Windows $mode::exit=$($p.ExitCode) $line"
          if ($p.ExitCode -ne 0) { $rc = 1 }
        }
        exit $rc

    - name: Window check (macOS)
      if: runner.os == 'macOS'
      continue-on-error: true
      timeout-minutes: 3
      shell: bash
      run: |
        out=$(dist/Transcribe-HTR.app/Contents/MacOS/Transcribe-HTR --window-check 2>&1); rc=$?
        echo "$out"
        echo "::notice title=macOS window::exit=$rc $(echo "$out" | grep -E 'WINDOWCHECK|Error|error' | tail -2 | tr '\n' ' ')"
        exit $rc

    - name: Window check (Windows)
      if: runner.os == 'Windows'
      continue-on-error: true
      timeout-minutes: 3
      shell: pwsh
      run: |
        $p = Start-Process -FilePath "dist\Transcribe-HTR\Transcribe-HTR.exe" -ArgumentList "--window-check" -PassThru -Wait
        $line = Get-Content "$env:TEMP\transcribe_htr_spike.log" -Tail 1
        Write-Output "::notice title=Windows window::exit=$($p.ExitCode) $line"
        exit $p.ExitCode

    - name: Archive app (macOS)
      if: runner.os == 'macOS'
      run: ditto -c -k --keepParent dist/Transcribe-HTR.app Transcribe-HTR-spike-macos-arm64.zip

    - name: Archive app (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path dist\Transcribe-HTR -DestinationPath Transcribe-HTR-spike-windows.zip

    - uses: actions/upload-artifact@v4
      with:
        name: spike-${{ matrix.os }}
        path: Transcribe-HTR-spike-*.zip
        retention-days: 7
