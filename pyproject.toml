[project]
name = "transkrybe-ai"
version = "2.0.0"
description = "LLM-assisted handwritten text recognition and analysis for historical manuscripts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Graham West" },
    { name = "John Wallin" },
]
keywords = [
    "handwritten text recognition",
    "historical document transcription",
    "manuscript analysis",
    "digital humanities",
    "vision language models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
]

# The runtime dependency list is maintained in backend/requirements.txt, which
# is what the documented install uses. This project is run as an application,
# not installed as a library.
dependencies = []

[project.optional-dependencies]
# soundfile enables richer audio metadata in core/audio_utils.py. Only needed
# if you turn text-to-speech back on (frontend/src/featureFlags.js).
audio = ["soundfile>=0.12.0"]

[project.urls]
Homepage = "https://github.com/gtw2i/Transcribe-HTR"
Repository = "https://github.com/gtw2i/Transcribe-HTR"

# Keep these in sync with the args in .pre-commit-config.yaml.
[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
